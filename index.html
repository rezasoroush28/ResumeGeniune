<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reza Soroush — Backend Developer & Creative Thinker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:"Poppins",sans-serif;
  background:#f5f8ff;
  color:#002855;
  overflow:hidden;
}

/* ===== DESKTOP VIEW (unchanged) ===== */
.scene{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  cursor:pointer;
  transition:all .8s ease;
}
.half{
  position:absolute;top:0;bottom:0;width:50%;
  overflow:hidden;transition:width .8s ease;
}
.left{left:0;background:radial-gradient(circle at 30% 50%,#e8f3ff,#d1e7ff 60%,#f5f8ff 100%);}
.right{right:0;background:linear-gradient(160deg,#ffd6a5,#ff9e7a,#ff7f6b);}
.half img{
  position:absolute;top:0;height:100vh;width:auto;object-fit:cover;pointer-events:none;transition:transform 1s ease;
}
.left img{left:50%;transform:translateX(-100%) translateX(+15px);}
.right img{left:50%;transform:translateX(0%) translateX(-15px);}
.backend-title,.creative-title{
  position:absolute;top:50%;transform:translateY(-50%);
  font-weight:800;font-size:3rem;letter-spacing:1.2px;
  white-space:nowrap;transition:all .8s ease;z-index:5;
}
.backend-title{right:5%;text-align:right;color:#002855;}
.creative-title{left:10%;text-align:left;color:#fffaf2;text-shadow:0 0 10px rgba(0,0,0,0.25);}
.code-intro{
  position:absolute;top:50%;left:55%;transform:translateY(-50%);
  font-family:"JetBrains Mono","Consolas",monospace;color:#d1e9ff;
  background:#0d1117;border:1px solid rgba(255,255,255,0.08);border-radius:12px;
  font-size:1rem;width:min(500px,45%);
  box-shadow:0 0 30px rgba(0,0,0,0.25);
  line-height:1.7;z-index:3;opacity:0;transition:opacity .8s ease,left 1s ease;
  white-space:pre;overflow:hidden;backdrop-filter:blur(4px);
}
.code-header{display:flex;align-items:center;justify-content:space-between;background:#161b22;padding:.45rem 1rem;border-bottom:1px solid rgba(255,255,255,0.08);}
.code-dots{display:flex;gap:6px;}
.dot{width:12px;height:12px;border-radius:50%;}
.dot.red{background:#ff5f56;} .dot.yellow{background:#ffbd2e;} .dot.green{background:#27c93f;}
.code-filename{color:#c9d1d9;font-size:.85rem;}
.code-body{padding:1.2rem 1.5rem;overflow-y:auto;max-height:70vh;word-break:break-word;}
.keyword{color:#4aa3ff;font-weight:600;} .string{color:#f77f00;} .var{color:#ffb703;} .prop{color:#80ff80;}

/* ===== MOBILE VIEW (centered swipe) ===== */
@media (max-width:768px){
  html,body{overflow:hidden;background:#000;}
  .scene{display:none;}

  #mobileScene{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .left-half, .right-half{
    width:50%;
    height:100%;
    transition:width 1s ease;
    position:absolute;
    top:0;
  }
  .left-half{
    left:0;
    background:radial-gradient(circle at 30% 50%,#e8f3ff,#d1e7ff 60%,#f5f8ff 100%);
  }
  .right-half{
    right:0;
    background:linear-gradient(160deg,#ffd6a5,#ff9e7a,#ff7f6b);
  }

  /* both faces centered visually */
  .side-image{
    position:absolute;
    top:0;
    left:50%;
    height:100%;
    width:auto;
    object-fit:cover;
    opacity:0;
    transform:translateX(-50%);
    transition:opacity 1s ease, transform 1s ease;
    pointer-events:none;
  }

  /* backend slightly lower */
  .backend {
    transform: translateX(-50%) translateY(3%);
  }

  /* creative slightly to the right */
  .creative {
    transform: translateX(-46%);
  }

  .divider{
    position:absolute;
    top:0;bottom:0;left:50%;
    width:2px;
    background:rgba(0,0,0,0.15);
    transform:translateX(-1px);
    z-index:5;
  }

  .hint{
    position:absolute;
    bottom:10%;
    left:50%;
    transform:translateX(-50%);
    color:#333;
    font-size:0.9rem;
    opacity:0.5;
    letter-spacing:1px;
  }
}
</style>
</head>
<body>

<!-- ===== DESKTOP ===== -->
<div class="scene center" id="scene">
  <div class="half left">
    <img src="dark-avatar.png" alt="Backend Developer" />
    <div class="backend-title">Backend Developer</div>
  </div>
  <div class="half right">
    <img src="creative-avatar.png" alt="Creative Thinker" />
    <div class="creative-title">Creative Thinker</div>
  </div>
</div>

<!-- ===== MOBILE ===== -->
<div id="mobileScene">
  <div class="left-half"></div>
  <div class="right-half"></div>
  <img src="dark-avatar.png" class="side-image backend" alt="Backend">
  <img src="creative-avatar.png" class="side-image creative" alt="Creative">
  <div class="divider"></div>
  <div class="hint">⇠ swipe ⇢</div>
</div>

<script>
if(window.innerWidth <= 768){
  const left = document.querySelector('.left-half');
  const right = document.querySelector('.right-half');
  const backend = document.querySelector('.backend');
  const creative = document.querySelector('.creative');
  let startX = null;
  let state = 0; // 0 = split, -1 = backend, 1 = creative

  window.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  window.addEventListener('touchend', e => {
    if(startX === null) return;
    const diff = e.changedTouches[0].clientX - startX;
    if(diff > 50){ // swipe right
      if(state === 1) setState(0);
      else setState(-1);
    }else if(diff < -50){ // swipe left
      if(state === -1) setState(0);
      else setState(1);
    }
    startX = null;
  });

  function setState(newState){
    if(state === newState) return;
    state = newState;
    if(state === -1){ // backend full center
      backend.style.opacity = 1;
      creative.style.opacity = 0;
      backend.style.transform = "translateX(-50%) translateY(3%) scale(1)";
      creative.style.transform = "translateX(-46%) scale(0.9)";
    }else if(state === 1){ // creative full center
      creative.style.opacity = 1;
      backend.style.opacity = 0;
      creative.style.transform = "translateX(-46%) scale(1)";
      backend.style.transform = "translateX(-50%) translateY(3%) scale(0.9)";
    }else{ // split center
      backend.style.opacity = 0;
      creative.style.opacity = 0;
      backend.style.transform = "translateX(-50%) translateY(3%) scale(1)";
      creative.style.transform = "translateX(-46%) scale(1)";
    }
  }
}
</script>
</body>
</html>
